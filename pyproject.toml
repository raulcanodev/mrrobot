[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrrobot"
version = "0.1.0"
description = "Orquestador modular de herramientas OSINT y pentesting autorizado (CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rawraul" }]
keywords = ["osint", "pentesting", "recon", "security", "cli"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "packaging>=24.0",
]

[project.optional-dependencies]
# Dejamos preparado el terreno para una futura interfaz (TUI) sin acoplarla al core.
tui = ["textual>=0.60"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
mrrobot = "mrrobot.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mrrobot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
